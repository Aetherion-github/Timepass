<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app" class="profile-page">
        <nav class="navbar">
            <h1><i class="fas fa-user-circle"></i> User Profile</h1>
            <button onclick="handleLogout()" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </nav>
        
        <div class="profile-container">
            <div class="profile-header">
                <div class="profile-picture-container">
                    <div id="profilePictureDisplay" class="profile-picture">
                        <i class="fas fa-user default-avatar"></i>
                    </div>
                </div>
                <div id="profileBasicInfo" class="profile-basic-info"></div>
            </div>
            
            <div class="profile-content">
                <div id="profileDetails" class="profile-details"></div>
            </div>
            
            <div class="profile-actions">
                <button onclick="goToForm()" class="edit-btn">
                    <i class="fas fa-edit"></i> Edit Profile
                </button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
